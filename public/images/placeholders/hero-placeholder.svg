<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EE"/>
      <stop offset="50%" stop-color="#EFE9E0"/>
      <stop offset="100%" stop-color="#E5DCcf"/>
    </linearGradient>
    <linearGradient id="drape-grad-1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#B69A62" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7A6535" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="drape-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9C7B4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A18A78" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Latar Belakang -->
  <rect width="1200" height="900" fill="url(#hero-grad-bg)"/>

  <!-- Border Editorial -->
  <rect x="30" y="30" width="1140" height="840" fill="none" stroke="#D9C7B4" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Bentuk Abstrak Geometris & Draperi Hijab -->
  <circle cx="600" cy="420" r="260" fill="#D9C7B4" opacity="0.3"/>
  <circle cx="700" cy="380" r="180" fill="#B69A62" opacity="0.15"/>

  <!-- Kurva Draperi Kain Hijab -->
  <path d="M 380 520 Q 520 220 720 320 T 900 600 Q 720 760 520 680 Z" fill="url(#drape-grad-1)"/>
  <path d="M 440 600 Q 560 360 760 420 Q 860 560 680 720 Q 520 760 440 600 Z" fill="url(#drape-grad-2)"/>

  <!-- Garis Aksen Halus -->
  <path d="M 420 360 Q 600 280 780 400" fill="none" stroke="#7A6535" stroke-width="2.5" opacity="0.6"/>
  <path d="M 460 480 Q 620 380 760 520" fill="none" stroke="#A18A78" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Tipografi Editorial -->
  <text x="600" y="770" font-family="Georgia, serif" font-size="44" fill="#3B3028" text-anchor="middle" font-weight="600" letter-spacing="2">Hairy Hijab</text>
  <text x="600" y="810" font-family="sans-serif" font-size="18" fill="#7A6535" text-anchor="middle" letter-spacing="4">EDITORIAL COLLECTION 2026</text>
</svg>
